name: H3C OpenConnect

on:
  push:
    branches: [openconnect/feat/h3c-current, rebase/incus-hotspot-20261119]
  pull_request:
    paths:
      - 'patches/sing-openconnect/**'
      - 'vendor/**'
      - 'option/openconnect.go'
      - 'tools/vendor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/openconnect-h3c.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3c-openconnect-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_TAGS: with_openconnect,with_gvisor,with_utls

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify tracked source without module access
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/vendor -p 'test_*.py' -v
          python3 tools/vendor/verify.py
      - name: Replay the pinned protocol patches
        run: |
          set -euo pipefail
          python3 patches/sing-openconnect/run.py prepare
          python3 patches/sing-openconnect/run.py check --vendor
      - name: Test the protocol and product from vendor
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          python3 patches/sing-openconnect/run.py test
          go test -mod=vendor -race -tags "$PRODUCT_TAGS" -count=1 ./protocol/openconnect ./transport/openconnect
          go vet -mod=vendor -tags "$PRODUCT_TAGS" ./protocol/openconnect ./transport/openconnect
      - name: Build the tracked source archive
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/package"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          python3 tools/vendor/verify.py
          version="1.15.0-dev.20261119-nagucath.1"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -buildvcs=false \
            -tags "$PRODUCT_TAGS" -ldflags "-X github.com/sagernet/sing-box/constant.Version=$version" \
            -o "$RUNNER_TEMP/package/sing-box" ./cmd/sing-box
          "$RUNNER_TEMP/package/sing-box" version
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/package/SOURCE_COMMIT"
          cp deps/vendor-lock.json "$RUNNER_TEMP/package/VENDOR_LOCK.json"
          cd "$RUNNER_TEMP/package"
          sha256sum sing-box SOURCE_COMMIT VENDOR_LOCK.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-h3c-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 14
